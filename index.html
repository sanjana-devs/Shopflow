<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ShopFlow Discover Products</title>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a href="#" class="logo">ShopFlow</a>
      <button class="cart-button" type="button">
        Cart <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">SHOP SMARTER</p>
        <h1>Discover products you'll love.</h1>
        <p class="hero-text">Explore products, compare prices, and find your next favorite.</p>
      </div>
    </section>

    <section class="products-section">
      <div class="container">
        <div class="controls">
          <label for="searchInput">Search Products</label>
          <input id="searchInput" type="search" placeholder="Search Products...">

          <label for="categorySelect">Category</label>
          <select id="categorySelect">
            <option value="all">All categories</option>
          </select>

          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="default">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>

        <!-- JavaScript will put product cards here -->
        <div id="productGrid" class="product-grid"></div>

        <!-- Messages such as loading, error, or no results -->
        <p id="productMessage"></p>
      </div>
    </section>
    <!-- Shopping cart panel -->
    <section id="cartPanel" class="cart-panel" hidden>

      <div class="cart-panel-header">
        <h2>Your Cart</h2>

        <button id="closeCartButton" type="button">
          Close
        </button>
      </div>

      <!-- JavaScript will display cart items here -->
      <div id="cartItems"></div>

      <!-- Cart total -->
      <p id="cartTotal">Total: €0.00</p>

    </section>
  </main>
  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
